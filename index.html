<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/theme-init.js"></script>
    <!--
      Name intro (#intro below, flagged by theme-init.js): styled inline so it is right from the
      first paint, in development too, without waiting for the app's stylesheet. Pure CSS: the
      name rises on the dark stage, the stage lifts away; it never takes clicks.
    -->
    <style>
      #intro {
        display: none;
      }
      html[data-intro] #intro {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        pointer-events: none;
        background: rgb(13 13 12);
        color: rgb(243 239 230);
        animation: intro-lift 0.6s cubic-bezier(0.76, 0, 0.24, 1) 1s both;
      }
      #intro p {
        display: flex;
        overflow: hidden;
        padding-block: 0.08em;
        font-family: 'Archivo Variable', 'Archivo', system-ui, sans-serif;
        font-size: clamp(3rem, 12vw, 13rem);
        font-weight: 900;
        font-stretch: 125%;
        letter-spacing: -0.03em;
        line-height: 0.9;
      }
      #intro span {
        display: inline-block;
        animation: intro-letter 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: calc(var(--i) * 0.05s);
      }
      @media (max-width: 639px) {
        #intro p {
          font-stretch: 100%;
        }
      }
      @keyframes intro-letter {
        from {
          transform: translateY(110%);
        }
      }
      @keyframes intro-lift {
        to {
          transform: translateY(-100%);
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html[data-intro] #intro {
          display: none;
        }
      }
    </style>

    <title>DuckHats | Programari i serveis digitals per a negocis</title>
    <meta
      name="description"
      content="Estudi de desenvolupament a Catalunya: aplicacions web, APIs, automatització i manteniment. Dissenyem, construïm i mantenim programari a mida."
      data-rh="true"
    />
    <meta name="author" content="DuckHats" />
    <meta name="theme-color" content="#EFEBE3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130F" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Defaults for crawlers that do not run JavaScript; <SEO> overrides them per page. -->
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:site_name" content="DuckHats" data-rh="true" />
    <meta
      property="og:title"
      content="DuckHats | Programari i serveis digitals per a negocis"
      data-rh="true"
    />
    <meta
      property="og:description"
      content="Estudi de desenvolupament a Catalunya: aplicacions web, APIs, automatització i manteniment."
      data-rh="true"
    />
    <meta property="og:image" content="%SITE_URL%/og-cover.png" data-rh="true" />
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:site" content="@Hats4Ducks" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DuckHats",
        "url": "%SITE_URL%",
        "logo": "%SITE_URL%/brand/logo-mark.png",
        "email": "%SITE_EMAIL%",
        "sameAs": [
          "https://github.com/DuckHats",
          "https://x.com/Hats4Ducks",
          "https://instagram.com/hats4_ducks"
        ]
      }
    </script>
  </head>
  <body>
    <!-- Name intro: shown only when theme-init.js sets data-intro; pure CSS (see index.css). -->
    <div id="intro" aria-hidden="true">
      <p>
        <span style="--i: 0">D</span><span style="--i: 1">U</span><span style="--i: 2">C</span
        ><span style="--i: 3">K</span><span style="--i: 4">H</span><span style="--i: 5">A</span
        ><span style="--i: 6">T</span><span style="--i: 7">S</span>
      </p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
